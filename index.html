<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title id="seo-title">Sarvyanta Business</title>
    <meta id="seo-description" name="description" content="Discover this business on Sarvyanta.">

    <!-- Canonical URL -->
    <link id="canonical-url" rel="canonical">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta id="og-title" property="og:title" content="Sarvyanta Business">
    <meta id="og-description" property="og:description" content="Discover this business on Sarvyanta.">
    <meta id="og-url" property="og:url">
    <meta property="og:site_name" content="Sarvyanta">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta id="twitter-title" name="twitter:title" content="Sarvyanta Business">
    <meta id="twitter-description" name="twitter:description" content="Discover this business on Sarvyanta.">

    <link rel="stylesheet" href="stele.css">
</head>

<body>

<header id="topBar">

    <div class="header-inner">

        <div class="brand">

            <img
                id="businessLogo"
                src=""
                alt="Business Logo"
            >

            <div>

                <h1 id="businessName">
                    Loading...
                </h1>

                <p id="tagline"></p>

            </div>

        </div>

    </div>


    <nav id="navigation">

        <a href="#about">
            About
        </a>

        <a href="#services">
            Services
        </a>

        <a href="#products">
            Products
        </a>

        <a href="#gallery">
            Gallery
        </a>

        <a href="#contact">
            Contact
        </a>

    </nav>

</header>


<main>


    <!-- ABOUT -->

    <section
        id="about"
        class="section-card"
    >

        <h2>
            About Us
        </h2>

        <p id="description"></p>

    </section>



    <!-- SERVICES -->

    <section
        id="services"
        class="section-card"
    >

        <h2>
            Our Services
        </h2>

        <div id="servicesList"></div>

        <!-- ONE WhatsApp button for entire Services section -->

        <div id="servicesWhatsapp"></div>

    </section>



    <!-- PRODUCTS -->

    <section
        id="products"
        class="section-card"
    >

        <h2>
            Our Products
        </h2>

        <div id="productsList"></div>

        <!-- ONE WhatsApp button for entire Products section -->

        <div id="productsWhatsapp"></div>

        <div id="productsNotes"></div>

    </section>



    <!-- GALLERY -->

    <section
        id="gallery"
        class="section-card"
    >

        <h2>
            Gallery
        </h2>

        <div
            id="galleryList"
            class="gallery-grid"
        ></div>

    </section>



    <!-- CONTACT -->

    <section
        id="contact"
        class="section-card"
    >

        <h2>
            Contact
        </h2>

        <p id="phone"></p>

        <p id="location"></p>


        <div class="contact-buttons">

            <a
                id="whatsappButton"
                class="button whatsapp"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                WhatsApp
            </a>


            <a
                id="instagramButton"
                class="button instagram"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                Instagram
            </a>


            <a
                id="facebookButton"
                class="button facebook"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                Facebook
            </a>

        </div>

    </section>

</main>



<footer>

    <p>
        Powered by Sarvyanta
    </p>

</footer>



<!-- LIGHTBOX -->

<div
    id="lightbox"
    class="lightbox"
>

    <button
        id="lightboxClose"
        class="lightbox-close"
    >
        ×
    </button>


    <button
        id="lightboxPrev"
        class="lightbox-arrow left"
    >
        ‹
    </button>


    <img
        id="lightboxImage"
        src=""
        alt="Gallery Image"
    >


    <button
        id="lightboxNext"
        class="lightbox-arrow right"
    >
        ›
    </button>


    <div id="lightboxCounter"></div>

</div>



<script src="app.js?v=4"></script>

</body>
  </html>
