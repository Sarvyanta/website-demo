<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Sarvyanta Business Onboarding</title> <style> body { font-family: Arial, sans-serif; background: #f5f6f8; margin: 0; padding: 20px; } .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; } h1 { margin-top: 0; } h2 { margin-top: 30px; border-bottom: 1px solid #ddd; padding-bottom: 8px; } label { display: block; margin-top: 15px; font-weight: bold; } input, textarea, select { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; } textarea { min-height: 100px; } .checkbox { margin-top: 10px; font-weight: normal; } .checkbox input { width: auto; margin-right: 8px; } .item { border: 1px solid #ddd; padding: 15px; margin-top: 15px; border-radius: 8px; } button { margin-top: 20px; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; } .add { background: #eee; } .submit { width: 100%; background: #222; color: white; font-size: 16px; } .business-id { background: #f0f0f0; color: #555; cursor: not-allowed; } </style> </head> <body> <div class="container"> <h1>Sarvyanta Business Onboarding</h1> <form id="businessForm"> <h2>Business Details</h2> <label>Business Name *</label> <input type="text" id="businessName" required> <label>Business ID</label> <input type="text" id="businessId" class="business-id" readonly placeholder="Automatically generated" > <label>Category *</label> <input type="text" id="category" required> <label>Tagline</label> <input type="text" id="tagline"> <label>Description</label> <textarea id="description"></textarea> <label>Logo</label> <input type="file" id="logo" accept="image/*"> <h2>Website Sections</h2> <label class="checkbox"> <input type="checkbox" id="sectionAbout" checked> About </label> <label class="checkbox"> <input type="checkbox" id="sectionServices" checked> Services </label> <label class="checkbox"> <input type="checkbox" id="sectionProducts" checked> Products </label> <label class="checkbox"> <input type="checkbox" id="sectionGallery" checked> Gallery </label> <label class="checkbox"> <input type="checkbox" id="sectionContact" checked> Contact </label> <h2>Contact</h2> <label>Phone</label> <input type="tel" id="phone"> <label>Location</label> <input type="text" id="location"> <label>WhatsApp Number</label> <input type="tel" id="whatsappNumber"> <label>WhatsApp Owner</label> <select id="whatsappOwner"> <option value="business">Business</option> <option value="sarvyanta">Sarvyanta</option> </select> <h2>Services</h2> <div id="servicesContainer"></div> <button type="button" class="add" onclick="addService()"> + Add Service </button> <h2>Products</h2> <div id="productsContainer"></div> <button type="button" class="add" onclick="addProduct()"> + Add Product </button> <h2>Gallery</h2> <input type="file" id="gallery" accept="image/*" multiple > <h2>Social</h2> <label>Instagram</label> <input type="url" id="instagram"> <label>Facebook</label> <input type="url" id="facebook"> <button type="submit" class="submit"> Create Business Website </button> </form> </div> <script> let serviceCount = 0; let productCount = 0; /* Generate Business ID */ function generateBusinessId(name) { return name .toLowerCase() .trim() .replace(/[^a-z0-9\s-]/g, "") .replace(/\s+/g, "-") .replace(/-+/g, "-") .replace(/^-|-$/g, ""); } /* Update Business ID */ document .getElementById("businessName") .addEventListener("input", function() { document .getElementById("businessId") .value = generateBusinessId(this.value); }); /* Add Service */ function addService() { serviceCount++; const container = document.getElementById("servicesContainer"); const item = document.createElement("div"); item.className = "item"; item.innerHTML = ` <label>Service ${serviceCount}</label> <input type="text" class="serviceName" placeholder="Example: Haircut & Styling" > `; container.appendChild(item); } /* Add Product */ function addProduct() { productCount++; const container = document.getElementById("productsContainer"); const item = document.createElement("div"); item.className = "item"; item.innerHTML = ` <label>Product ${productCount}</label> <input type="text" class="productName" placeholder="Product name" > <label>Price</label> <input type="number" class="productPrice" placeholder="Price" > <label>Product Image</label> <input type="file" class="productImage" accept="image/*" > `; container.appendChild(item); } /* Form Submit */ document .getElementById("businessForm") .addEventListener("submit", function(event) { event.preventDefault(); const businessName = document .getElementById("businessName") .value .trim(); const businessId = generateBusinessId(businessName); /* Services */ const services = []; document .querySelectorAll(".serviceName") .forEach(input => { if (input.value.trim()) { services.push( input.value.trim() ); } }); /* Products */ const products = []; document .querySelectorAll("#productsContainer .item") .forEach(item => { const name = item.querySelector(".productName"); const price = item.querySelector(".productPrice"); const image = item.querySelector(".productImage"); if (name && name.value.trim()) { products.push({ name: name.value.trim(), price: price ? price.value : "", image: image && image.files.length > 0 ? "assets/products/" + image.files[0].name : "" }); } }); /* Logo */ const logoInput = document.getElementById("logo"); const logoPath = logoInput.files.length > 0 ? "assets/logo/" + logoInput.files[0].name : ""; /* Gallery */ const galleryInput = document.getElementById("gallery"); const gallery = []; if (galleryInput.files.length > 0) { Array.from(galleryInput.files) .forEach(file => { gallery.push( "assets/gallery/" + file.name ); }); } /* Final JSON */ const data = { business: { id: businessId, name: businessName, category: document .getElementById("category") .value .trim(), tagline: document .getElementById("tagline") .value .trim(), description: document .getElementById("description") .value .trim(), logo: logoPath }, sections: { about: document .getElementById("sectionAbout") .checked, services: document .getElementById("sectionServices") .checked, products: document .getElementById("sectionProducts") .checked, gallery: document .getElementById("sectionGallery") .checked, contact: document .getElementById("sectionContact") .checked }, contact: { phone: document .getElementById("phone") .value .trim(), location: document .getElementById("location") .value .trim() }, whatsapp: { number: document .getElementById("whatsappNumber") .value .trim(), owner: document .getElementById("whatsappOwner") .value }, services: services, products: products, gallery: gallery, social: { instagram: document .getElementById("instagram") .value .trim(), facebook: document .getElementById("facebook") .value .trim() } }; /* Generate JSON */ const jsonData = JSON.stringify(data, null, 2); const blob = new Blob( [jsonData], { type: "application/json" } ); const url = URL.createObjectURL(blob); const downloadLink = document.createElement("a"); downloadLink.href = url; downloadLink.download = "data.json"; document.body.appendChild(downloadLink); downloadLink.click(); document.body.removeChild(downloadLink); URL.revokeObjectURL(url); alert( "Business data.json has been generated and downloaded." ); }); </script> </body> </html>
